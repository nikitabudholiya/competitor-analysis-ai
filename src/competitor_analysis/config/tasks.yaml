find_competitors_task:
  description: >
    You are a market research expert. Research {company_name} and find 
    their top 5 competitors.

    For EACH competitor write:
    - Company Name
    - Website
    - Founded Year
    - What they do (2-3 lines)
    - Target Audience
    - Pricing Model (Free/Paid/Enterprise)
    - Key Features (at least 4-5 features)
    - Funding/Revenue (if known)
    - Market Presence (countries/regions)

    Be very detailed. Do not skip any competitor.
  expected_output: >
    A detailed numbered list of exactly 5 competitors of {company_name}
    with all fields filled — name, website, founded year, description,
    target audience, pricing, key features, funding, and market presence.
  agent: competitor_finder

analyze_competitors_task:
  description: >
    You are a business analyst. Using the competitor list from the
    previous research, do a DEEP analysis of {company_name} itself
    AND each of its competitors.

    FIRST — Analyze {company_name} itself:

    {company_name} — STRENGTHS (at least 5):
    - List detailed strengths of {company_name}

    {company_name} — WEAKNESSES (at least 5):
    - List detailed weaknesses of {company_name}

    {company_name} — OPPORTUNITIES:
    - What opportunities can {company_name} grab right now?

    {company_name} — THREATS:
    - What threats does {company_name} face?

    THEN — For EACH of the 5 competitors write:

    STRENGTHS (at least 5):
    - List detailed strengths

    WEAKNESSES (at least 5):
    - List detailed weaknesses

    OPPORTUNITIES THEY ARE MISSING:
    - What are they failing to address?

    CUSTOMER COMPLAINTS:
    - What do customers hate about them?

    PRICING GAPS:
    - Are they too expensive? Too cheap? Missing tiers?

    MARKET SHARE ESTIMATE:
    - Rough estimate of their market position

    Also write:
    - Overall Market Size estimate for this industry
    - Market Growth Rate (is this industry growing?)
    - Total Addressable Market (TAM)
    - Key industry trends in 2025-2026

    Be very thorough. This is a professional business report.
  expected_output: >
    A comprehensive analysis starting with {company_name} own strengths,
    weaknesses, opportunities and threats — followed by analysis of all
    5 competitors with strengths, weaknesses, opportunities missed,
    customer complaints, pricing gaps, and market share estimates.
    Plus overall market size, growth rate, TAM, and industry trends.
  agent: competitor_analyst

strategy_task:
  description: >
    You are the lead strategy advisor. Using ALL the research and
    analysis from the previous agents, write ONE complete, professional,
    beautiful markdown report for {company_name}.

    The report MUST include ALL of these sections with full detail:

    ---

    # 🚀 Competitor Analysis Report — {company_name}
    *Generated by AI Competitor Analysis Tool*

    ---

    ## 📌 Executive Summary
    Write 5-6 lines about {company_name}, their market,
    and what this report covers.

    ---

    ## 📈 Market Overview
    - Market Size (TAM)
    - Market Growth Rate
    - Key Trends in 2025-2026
    - Is this market profitable?
    - Top challenges in this industry

    ---

    ## 💪 {company_name} — SWOT Analysis
    Write a full SWOT for {company_name} itself:

    ### ✅ Strengths of {company_name}
    - (list at least 5 strengths)

    ### ❌ Weaknesses of {company_name}
    - (list at least 5 weaknesses)

    ### 🚀 Opportunities for {company_name}
    - (list at least 4 opportunities)

    ### ⚠️ Threats to {company_name}
    - (list at least 4 threats)

    ---

    ## 🏢 Top 5 Competitors

    For each competitor write a full section:
    ### 1. [Competitor Name]
    - 🌐 Website:
    - 📅 Founded:
    - 📝 About:
    - 👥 Target Audience:
    - 💰 Pricing:
    - ⚡ Key Features:
    - 🌍 Market Presence:
    - 💵 Funding/Revenue:

    (Repeat for all 5 competitors)

    ---

    ## ⚔️ Competitors Strengths & Weaknesses Analysis

    For each competitor:
    ### [Competitor Name]
    ✅ Strengths:
    - (list at least 5)

    ❌ Weaknesses:
    - (list at least 5)

    🕳️ Gaps & Opportunities Missed:
    - (list 3-4)

    😤 Customer Complaints:
    - (list 3-4)

    (Repeat for all 5 competitors)

    ---

    ## 🎯 Market Gap Analysis
    - What is the BIGGEST gap in the market?
    - What pain points are ALL competitors missing?
    - What type of customer is being ignored?
    - What price point is missing?

    ---

    ## 💡 Unique Value Proposition for {company_name}
    - Recommended UVP (2-3 lines)
    - Why this UVP works
    - How it is different from all 5 competitors

    ---

    ## 🚀 3 Actionable Strategies to Beat Competitors

    ### Strategy 1: [Name]
    - What to do
    - Why it works
    - How to execute

    ### Strategy 2: [Name]
    - What to do
    - Why it works
    - How to execute

    ### Strategy 3: [Name]
    - What to do
    - Why it works
    - How to execute

    ---

    ## ⚠️ Risks & How to Handle Them
    - Risk 1 + Solution
    - Risk 2 + Solution
    - Risk 3 + Solution

    ---

    ## 📊 Competitor Comparison Table

    | Feature | {company_name} | Competitor 1 | Competitor 2 | Competitor 3 |
    |---|---|---|---|---|
    | Pricing | | | | |
    | Target Audience | | | | |
    | Key Strength | | | | |
    | Key Weakness | | | | |
    | Market Presence | | | | |

    ---

    ## ✅ Conclusion
    3-4 lines summarizing the opportunity for {company_name}.

    ---

    Make every section VERY detailed and professional.
    Do NOT skip any section. This is the final deliverable.
  expected_output: >
    A complete, detailed, professional markdown report with ALL sections
    filled — executive summary, market overview, {company_name} SWOT
    analysis, top 5 competitors with full details, competitor strengths
    and weaknesses, market gap analysis, UVP, 3 strategies, risks,
    comparison table, and conclusion. NO taglines section.
  agent: strategy_advisor